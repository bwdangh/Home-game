<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{background:#0b0d17}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Home Game Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Game">
<meta name="theme-color" content="#0b0d17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column. Midnight surfaces with soft violet glow, one violet-to-pink gradient for primary actions, color = meaning (mint in, rose out, amber owed to house, sky house owes). */
:root{
  --bg:#0b0d17; --surface:#14172a; --surface-2:#1b1f38; --surface-3:#252a4a; --line:#2a2f55;
  --ink:#f4f5ff; --muted:#9ca2cc; --faint:#666c99;
  --gold:#8b7bff; --gold-hi:#b9adff; --gold-ink:#ffffff; --emerald:#2ee6a6;
  --grad:linear-gradient(135deg,#6d5dfc 0%,#a855f7 55%,#ec4899 100%); --glow:0 10px 28px -8px rgba(139,92,246,.6);
  --in:#2ee6a6; --out:#ff6b8b; --owes-house:#ffb547; --owes-player:#4cc3ff;
  --font:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,table,.v{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:800}
h2{font-size:1.06rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* App shell: the page itself never scrolls; only <main> does, so the tab bar can't drift on iPhone. */
#app{position:fixed;inset:0;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header.top{flex:none;position:relative;z-index:5;background:rgba(11,13,23,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
header.top .grow{flex:1;min-width:0}
header.top .sub{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 24px;display:grid;gap:12px;align-content:start}

nav.tabs{flex:none;position:relative;z-index:6;background:rgba(20,23,42,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;width:100%;max-width:640px;gap:4px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:grid;justify-items:center;gap:3px;color:var(--faint);font-size:.68rem;font-weight:600;cursor:pointer;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--gold)}
nav.tabs button[aria-current="true"] svg{filter:drop-shadow(0 0 8px rgba(139,123,255,.55))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tap{cursor:pointer;display:block;width:100%;text-align:left;color:var(--ink)}
.card.tap:active{background:var(--surface-2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:baseline}
.kv .v{text-align:right;font-weight:700}
.kv .total{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.btn{appearance:none;border:0;background:var(--grad);color:var(--gold-ink);box-shadow:var(--glow);transition:transform .15s ease,filter .15s ease,box-shadow .2s ease;font-weight:700;border-radius:14px;padding:10px 16px;cursor:pointer;min-height:46px}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.ghost{background:var(--surface-3);color:var(--ink);box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.btn.danger{box-shadow:none;background:rgba(255,107,139,.12);color:var(--out)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.card.tap:focus-visible,.seatrow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.iconbtn{background:var(--surface-2);border:0;color:var(--ink);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--surface-3);color:var(--muted)}
.pill.open{background:rgba(46,230,166,.14);color:var(--in)}
.pill.open::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.closed{background:var(--surface-3);color:var(--muted)}
.pill.reg{background:rgba(139,123,255,.18);color:var(--gold-hi)}
.pill.wait{background:rgba(255,181,71,.14);color:var(--owes-house)}
.owes-house{color:var(--owes-house)} .owes-player{color:var(--owes-player)} .win,.in{color:var(--in)} .loss,.out{color:var(--out)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}

.segs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.segs button{flex:1;background:none;border:0;border-radius:10px;padding:9px 4px;color:var(--muted);font-weight:600;cursor:pointer;font-size:.92rem}
.segs button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}

.field{display:grid;gap:5px}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink);font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;box-shadow:var(--glow)}
.chip:disabled{opacity:.3;cursor:not-allowed}

/* Stat tiles */
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat>div{background:var(--surface-2);border-radius:14px;padding:12px}
.stat .v{font-size:1.3rem;font-weight:800;margin-top:2px}
.stat .hint{font-size:.76rem;color:var(--muted)}
.net{font-size:1.6rem;font-weight:800}

/* Player cards: tinted by seat color */
.player{display:grid;gap:12px;background:linear-gradient(180deg,var(--pcbg,transparent),transparent 70%),var(--surface);border-color:var(--pcline,var(--line))}
.namebtn{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;color:var(--ink)}
.namebtn h2{font-size:1.1rem}
.seat{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;border-radius:10px;background:var(--pc,var(--gold));color:#0b1411;font-weight:800;font-size:.9rem}
.seat.open{background:transparent;border:1.5px dashed var(--line);color:var(--faint)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.minis>div{background:rgba(255,255,255,.035);border-radius:12px;padding:8px 10px;min-width:0}
.minis .v{font-weight:800;font-size:1.02rem}
.minis .label{font-size:.64rem}
.statusline{font-size:.9rem;font-weight:600}
.paidby{font-size:.82rem;color:var(--muted)}
.note{font-style:italic;color:var(--muted);font-size:.88rem}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.actions .btn{min-height:40px;padding:6px 8px;font-size:.9rem;border-radius:11px}
.history{font-size:.85rem;display:grid;gap:4px;margin-top:6px}
.history .h{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:7px 0 2px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:36px}
.history button.h:active{background:var(--surface-3)}
.history .pen{color:var(--gold-hi);margin-left:6px}
.history button{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px 6px}
details summary{cursor:pointer}

/* Tables */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
tr.tot td{border-bottom:0;font-weight:800}

/* Settlement */
.settle{display:grid;gap:14px}
.settle .hero{display:grid;gap:4px;background:var(--surface-2);border-radius:14px;padding:14px}
.settle .hero .big{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.methodrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.methodrow .m{font-weight:700}
.methodrow .amt{font-weight:800;font-size:1.08rem;text-align:right}
.methodrow .calc{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.owelist{display:grid;gap:6px}
.owelist .o{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:9px 12px}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flow>div{background:var(--surface-2);border-radius:14px;padding:12px;display:grid;gap:4px;min-width:0}
.flow .line{display:flex;justify-content:space-between;gap:6px;font-size:.84rem}
.flow .head{display:flex;justify-content:space-between;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:.92rem}
.badge.ok{background:rgba(46,230,166,.12);color:var(--in)}
.badge.warn{background:rgba(255,181,71,.12);color:var(--owes-house)}

.empty{text-align:center;padding:28px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.suits{font-size:1.3rem;letter-spacing:.35em;color:var(--gold)}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;border-top:1px solid var(--line)}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto}
.err{color:var(--out);font-size:.88rem;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:30;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}

/* Lock screen */
.lock{flex:1;overflow-y:auto;display:grid;place-items:center;padding:24px 16px}
.lock .box{width:100%;max-width:340px;display:grid;gap:20px;justify-items:center;text-align:center}
.dots{display:flex;gap:14px;min-height:14px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--surface-3)}
.dots i.on{background:var(--grad);box-shadow:0 0 12px rgba(168,85,247,.7)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{width:74px;height:74px;border-radius:50%;border:0;background:var(--surface-2);font-size:1.5rem;font-weight:600;color:var(--ink);cursor:pointer}
.pad button:active{background:var(--grad);color:#fff}
.chipmark{width:68px;height:68px;border-radius:20px;background:var(--gold);display:grid;place-items:center;color:var(--gold-ink);font-size:2rem;font-weight:800}
.chipmark span{line-height:1}

/* Seats */
.seatgrid{display:grid;gap:6px}
.seatrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:9px 12px;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.seatrow.filled{background:linear-gradient(90deg,var(--pcbg),transparent),var(--surface-2);border-color:var(--pcline)}
.seatrow .grow{flex:1;min-width:0}
.seatrow .seatname{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:40px}
.seatrow .seatout{flex:none;padding:6px 12px;min-height:34px}
.payline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center}
.payline .x{background:var(--surface-2);border:0;border-radius:10px;height:40px;color:var(--muted);cursor:pointer}
.preview{background:var(--surface-2);border-radius:14px;padding:12px;display:grid;gap:5px;font-size:.92rem}
.closegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.closegrid>.card{display:grid;gap:8px;align-content:start;min-width:0;padding:14px}
.closegrid .segs{padding:3px}
.closegrid .segs button{padding:6px 2px;font-size:.85rem}
@media (max-width:360px){.closegrid,.flow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
.session summary{list-style:none;cursor:pointer;display:grid;gap:2px}
.session summary::-webkit-details-marker{display:none}
.session[open] summary{padding-bottom:10px;border-bottom:1px solid var(--line)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left}
.grid2 input,.grid2 select{min-width:0;max-width:100%}
body{background:radial-gradient(90% 50% at 0% 0%,rgba(109,93,252,.22),transparent 60%),radial-gradient(70% 40% at 100% 100%,rgba(236,72,153,.14),transparent 60%),var(--bg)}
.card{transition:background .2s ease,border-color .2s ease}
.segs button{transition:background .2s ease,color .2s ease}
.segs button[aria-pressed="true"]{background:linear-gradient(135deg,rgba(109,93,252,.35),rgba(236,72,153,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(185,173,255,.25)}
nav.tabs button{transition:color .2s ease}
nav.tabs button[aria-current="true"]{color:var(--gold-hi)}
.stat>div{border:1px solid rgba(255,255,255,.04)}
.settle .hero{background:linear-gradient(135deg,rgba(109,93,252,.22),rgba(236,72,153,.12)),var(--surface-2)}
.toast{background:var(--grad);color:#fff;box-shadow:var(--glow)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(139,123,255,.25)}
.iconbtn{transition:background .2s ease}
.bomb.on{border-color:rgba(236,72,153,.45);box-shadow:var(--glow)}
.switch{appearance:none;flex:none;width:54px;height:32px;border-radius:999px;border:0;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s ease}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s ease;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch[aria-checked=true]{background:var(--grad)}
.switch[aria-checked=true] i{transform:translateX(22px)}
.bombnext{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bombnext b{font-size:1.7rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold-hi);font:inherit;cursor:pointer;text-decoration:underline}
.alarm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(8,8,20,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.alarmbox{width:min(100%,380px);display:grid;gap:12px;text-align:center;padding:28px 22px;border-radius:24px;background:var(--grad);box-shadow:0 0 60px rgba(236,72,153,.55);color:#fff;animation:pulse 1s ease-in-out infinite alternate}
.alarmbox h1{font-size:2.6rem;letter-spacing:.04em;margin:0}
.alarmbox .boom{font-size:3.4rem;line-height:1}
.alarmbox .num{font-size:1.2rem;font-weight:700;opacity:.9}
.alarmbox p{margin:0}
.alarmbox .btn{background:#fff;color:#2a1f6e;box-shadow:none}
.alarmbox .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.alarmbox{animation:none}}
.books{color:#c084fc}
.pill.books{background:rgba(192,132,252,.16);color:#d8b4fe}
.pill.house{background:var(--grad);color:#fff}
.badge.books{background:rgba(192,132,252,.14);color:#e9d5ff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.closegrid .dealers{grid-column:1/-1}
.dealers .dealer{border-top:1px solid var(--line);padding-top:10px}
.dealers .dealer:first-child{border-top:0;padding-top:0}
.booksbtn{color:#e9d5ff;border:1px solid rgba(192,132,252,.45)}
.pcard{position:relative;box-shadow:inset 4px 0 0 color-mix(in srgb,var(--pc) 80%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 10%,transparent),transparent 55%),var(--surface);border-color:color-mix(in srgb,var(--pc) 25%,var(--line));padding:11px 12px 11px 16px}
.pcard .row{align-items:center;gap:12px;flex-wrap:nowrap}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.78rem;color:#0b0d17;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 80%,#1b1f38),color-mix(in srgb,var(--pc) 50%,#fff));box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 18%,transparent)}
.pcard .grow{flex:1;display:grid;gap:3px;min-width:0}
.pcard .pname{font-size:.95rem}
.pcard .small{font-size:.78rem}
.pcard .pill{font-size:.66rem;padding:2px 8px}
.pcard .tags{display:flex;flex-wrap:wrap;gap:5px}
.pill.reg{background:linear-gradient(135deg,rgba(109,93,252,.26),rgba(236,72,153,.22));color:#ead5fb}
.pill.seatpref{background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc)}
.pcard .nights{flex:none;display:grid;justify-items:end;line-height:1.1;color:var(--muted)}
.pcard .nights b{font-size:1.05rem;color:var(--ink)}
.pcard .nights .small{font-size:.72rem}
.due{flex:none;display:grid;justify-items:end;line-height:1.1;padding:6px 10px;border-radius:12px;color:#fff}
.due .label{font-size:.56rem;color:rgba(255,255,255,.85)}
.due b{font-size:1.02rem}
.due .small{color:rgba(255,255,255,.8);font-size:.62rem}
.due.in{background:linear-gradient(135deg,#d98a14,#d14848 60%,#cf4a8c);box-shadow:0 6px 16px -8px rgba(239,68,68,.5)}
.due.out{background:linear-gradient(135deg,#1aa3bd,#5a5ed6);box-shadow:0 6px 16px -8px rgba(99,102,241,.5)}
.pcard.owes{border-color:rgba(251,113,133,.5);box-shadow:inset 4px 0 0 color-mix(in srgb,var(--pc) 80%,transparent),0 10px 24px -16px rgba(239,68,68,.6)}
.pcard.owed{border-color:rgba(76,195,255,.42)}
.booksboard{display:grid;gap:12px;background:radial-gradient(120% 140% at 0% 0%,rgba(245,158,11,.14),transparent 55%),radial-gradient(120% 140% at 100% 0%,rgba(236,72,153,.16),transparent 55%),var(--surface);border-color:rgba(244,114,182,.32)}
.bookstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bs{border-radius:14px;padding:10px 12px;color:#fff}
.bs .label{color:rgba(255,255,255,.85)}
.bs .v{font-size:1.2rem;font-weight:800}
.bs.in{background:linear-gradient(135deg,#d98a14,#d14848 60%,#cf4a8c)}
.bs.out{background:linear-gradient(135deg,#1aa3bd,#5a5ed6)}

<body>
<div id="app"></div>

<script>
(() => {
'use strict';
const KEY = 'homeGameLedger.v1';
const APP_VERSION = '18 · Softer roster';
const MAX_PLAYERS = 40;
const GAME_TYPES = ['2/5 NLH','5/10 NLH','2/5 Omaha'];
const METHODS = ['Cash','Venmo','Cash App','Apple Pay','PayPal','Other']; // Dinesh doesn't take Zelle or Card from players
const EXP_METHODS = [...METHODS, 'Card']; // the house can still pay its own expenses by card
// Keep an older entry's method (e.g. Zelle) selectable so editing it doesn't silently change it.
const withCur = (list, v) => !v || list.includes(v) ? list : [...list, v];
const SETTLE = 'Settle at end';
const NETTED = 'Netted from chips';
const BOOKS = 'On books'; // credit settled on a later day: a cpay means the house owes the player, a bpay means the player owes the house. Not tonight's money.
const CATEGORIES = ['Rent / Venue','Food & Drinks','Cards & Chips','Equipment','Supplies','Staff','Other'];
// Soft, distinct tints that read well on dark felt, one per seat
const COLORS = ['#22d3ee','#a78bfa','#f472b6','#34d399','#60a5fa','#fb923c','#e879f9','#facc15','#2dd4bf','#fb7185'];

/* ---------- data ---------- */
const blank = () => ({ version:2, passHash:null, players:[], nights:[], expenses:[], lastBackup:null });
let D = blank();
let storageOK = true;
function migrate(){
  D.nights.forEach(n => {
    if (!n.gameType) n.gameType = GAME_TYPES.find(g => n.blinds && g.startsWith(n.blinds)) || GAME_TYPES[0];
    if (Array.isArray(n.nightExpenses)){ n.expense = (n.expense || 0) + n.nightExpenses.reduce((s,x) => s + x.amount, 0); n.expenseNote = n.expenseNote || n.nightExpenses.map(x => x.desc).join(', '); delete n.nightExpenses; }
    n.expense ||= 0; n.housePlay ||= 0; n.expenseNote ||= ''; n.seats ||= 9;
    n.rsvps ||= []; n.entries ||= [];
    if (!n.dealers) n.dealers = n.tips ? [{ name:'Dealer 1', tips: n.tips, pays: [{ amount: n.tips, method: n.tipsMethod || 'Cash' }] }] : [];
  });
  D.players.forEach(p => { if (p.prefSeat === undefined) p.prefSeat = 0; });
  D.bookPays ||= [];
  if (D.housePid === undefined) D.housePid = D.players.find(p => p.name.trim().toLowerCase() === 'dinesh purohit')?.id || null;
  D.version = 2;
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) D = Object.assign(blank(), JSON.parse(raw)); }
  catch(e){ storageOK = false; }
  migrate();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); storageOK = true; }
  catch(e){ storageOK = false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sum = (a,f) => a.reduce((s,x) => s + (f ? f(x) : x), 0);
const toCents = v => { const n = parseFloat(String(v).replace(/[$,\s]/g,'')); return isFinite(n) ? Math.round(n*100) : NaN; };
const money = (c, sign) => { const neg = c < 0; const s = '$' + (Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits:2}); return neg ? '−' + s : (sign && c > 0 ? '+' + s : s); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); };
const shortDate = iso => fmtDate(iso).replace(/, \d{4}$/,'');
const fmtMonth = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); };
const fmtTime = t => { if (!t) return ''; const [h,m] = t.split(':').map(Number); const d = new Date(); d.setHours(h,m); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
const player = id => D.players.find(p => p.id === id);
const pname = id => player(id)?.name || 'Removed player';
const night = id => D.nights.find(n => n.id === id);
const rsvp = (n, pid) => n.rsvps.find(r => r.pid === pid);

/* ---------- money math ---------- */
// Entries per night: buyin, bpay (player paid house), cashout, cpay (house paid player).
// A buy-in's unpaid part is "Settle at end": it shows as owed to house until the player cashes out.
function playerLedger(n, pid){
  const e = n.entries.filter(x => x.pid === pid);
  const by = k => sum(e.filter(x => x.kind === k), x => x.amount);
  const buyin = by('buyin'), bpaid = by('bpay'), cashout = by('cashout'), cpaid = by('cpay');
  return { e, buyin, bpaid, cashout, cpaid, owesHouse: buyin - bpaid, houseOwes: cashout - cpaid, result: cashout - buyin,
    buyins: e.filter(x => x.kind === 'buyin').length, checkedOut: e.some(x => x.kind === 'cashout') };
}
// What the house still owes a player from cash-outs put "On books", minus payoffs recorded later.
// On-books balances carried across nights, minus payoffs recorded later. dir 'out' = house paid the player, 'in' = player paid the house.
const booksSum = (pid, kind) => sum(D.nights.flatMap(n => n.entries.filter(x => x.pid === pid && x.kind === kind && x.method === BOOKS)), x => x.amount);
const booksOwed = pid => booksSum(pid, 'cpay') - sum((D.bookPays || []).filter(x => x.pid === pid && x.dir !== 'in'), x => x.amount);
const booksOwing = pid => booksSum(pid, 'bpay') - sum((D.bookPays || []).filter(x => x.pid === pid && x.dir === 'in'), x => x.amount);
const booksPills = pid => (booksOwed(pid) > 0 ? `<span class="pill books">House owes ${money(booksOwed(pid))} on books</span>` : '') + (booksOwing(pid) > 0 ? `<span class="pill books">Owes ${money(booksOwing(pid))} on books</span>` : '');
const housePill = pid => pid && pid === D.housePid ? '<span class="pill house">House</span>' : '';
function nightPlayers(n){
  const ids = n.rsvps.map(r => r.pid);
  n.entries.forEach(x => { if (!ids.includes(x.pid)) ids.push(x.pid); });
  const seatOf = id => { const s = rsvp(n, id)?.seat; return s && s <= n.seats ? s : 99; };
  return ids.sort((a,b) => seatOf(a) - seatOf(b));
}
function nightTotals(n){
  const hp = D.housePid && n.entries.some(e => e.pid === D.housePid) ? D.housePid : null; // the house playing tonight
  const L = nightPlayers(n).filter(pid => pid !== hp).map(pid => playerLedger(n, pid));
  const H = hp ? playerLedger(n, hp) : null;
  const all = H ? [...L, H] : L;
  const t = {
    players: all.length, housePid: hp,
    buyin: sum(all, l => l.buyin), bpaid: sum(all, l => l.bpaid),
    cashout: sum(all, l => l.cashout), cpaid: sum(all, l => l.cpaid),
    owesHouse: sum(L, l => Math.max(0, l.owesHouse)),
    houseOwes: sum(L, l => Math.max(0, l.houseOwes)),
    rake: n.rake || 0, tips: sum(n.dealers || [], d => d.tips), nightExp: n.expense || 0,
    // House play is the house player's own result when they sat in tonight; otherwise the amount typed on the Settle tab.
    housePlay: H ? (H.checkedOut ? H.result : 0) : (n.housePlay || 0),
    onBooks: sum(n.entries.filter(x => x.kind === 'cpay' && x.method === BOOKS), x => x.amount),
    onBooksIn: sum(n.entries.filter(x => x.kind === 'bpay' && x.method === BOOKS), x => x.amount),
  };
  // Dealer tips come out of the players' chips, so they are not a house cost.
  t.net = t.rake - t.nightExp + t.housePlay;
  t.expectedDiff = t.rake + t.tips + (H ? 0 : t.housePlay); // chips that left the table without being cashed out
  t.byMethod = methodTotals(n.entries);
  return t;
}
function methodTotals(entries){
  const m = {};
  entries.forEach(x => {
    if ((x.kind !== 'bpay' && x.kind !== 'cpay') || x.method === NETTED || x.method === BOOKS) return;
    const r = m[x.method] ||= { in:0, out:0 };
    if (x.kind === 'bpay') r.in += x.amount; else r.out += x.amount;
  });
  return m;
}
function seating(n){
  const rs = n.rsvps.map(r => ({...r, p: player(r.pid)})).filter(r => r.p);
  const seated = rs.filter(r => r.seat && r.seat <= n.seats).sort((a,b) => a.seat - b.seat);
  const waitlist = rs.filter(r => !(r.seat && r.seat <= n.seats) && !playerLedger(n, r.pid).checkedOut).sort((a,b) => (b.p.regular - a.p.regular) || (a.t - b.t));
  return { seated, waitlist };
}
const takenSeats = (n, exceptPid) => n.rsvps.filter(r => r.pid !== exceptPid && r.seat && r.seat <= n.seats).map(r => r.seat);
function colorOf(n, pid){
  const s = rsvp(n, pid)?.seat;
  const i = s ? s - 1 : nightPlayers(n).indexOf(pid);
  const c = COLORS[(i < 0 ? 0 : i) % COLORS.length];
  return `--pc:${c};--pcbg:${c}22;--pcline:${c}55`;
}

/* ---------- UI state ---------- */
const UI = { locked:true, tab:'nights', nightId:null, nightTab:'money', month:null, report:'month', reportPlayer:null, entry:'', histOpen: new Set() };
const $app = document.getElementById('app');
let sheetEl = null;

function toast(msg){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- passcode ---------- */
async function hash(s){
  const salted = 'hgl:' + s;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salted));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 2166136261; for (const c of salted) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 'f' + (h>>>0).toString(16);
  }
}
let setupFirst = null;
function renderLock(){
  const setting = !D.passHash;
  const title = setting ? (setupFirst ? 'Confirm passcode' : 'Create a host passcode') : 'Enter passcode';
  const sub = setting ? 'Six digits. Share it only with your partner.' : 'Host access only';
  $app.innerHTML = `
  <div class="lock"><div class="box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="84" height="84" style="border-radius:20px;display:block" aria-hidden="true">   <defs>     <radialGradient id="bg" cx="30%" cy="20%" r="95%">       <stop offset="0" stop-color="#2a1f6e"/>       <stop offset=".55" stop-color="#12142b"/>       <stop offset="1" stop-color="#0a0b18"/>     </radialGradient>     <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">       <stop offset="0" stop-color="#6d5dfc"/>       <stop offset=".55" stop-color="#a855f7"/>       <stop offset="1" stop-color="#ec4899"/>     </linearGradient>     <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">       <stop offset="0" stop-color="#1d1f45"/>       <stop offset="1" stop-color="#11122a"/>     </linearGradient>     <linearGradient id="spade" x1="0" y1="0" x2="0" y2="1">       <stop offset="0" stop-color="#ffffff"/>       <stop offset="1" stop-color="#e3dcff"/>     </linearGradient>     <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>   </defs>   <rect width="84" height="84" style="border-radius:20px;display:block" aria-hidden="true" fill="url(#bg)"/>   <circle cx="512" cy="530" r="330" fill="#a855f7" opacity=".45" filter="url(#glow)"/>   <circle cx="512" cy="512" r="330" fill="url(#ring)"/>   <g fill="#ffffff" opacity=".92">     <g id="ins"><path d="M512 182 L558 186 L552 258 L472 258 L466 186 Z"/></g>     <use href="#ins" transform="rotate(60 512 512)"/>     <use href="#ins" transform="rotate(120 512 512)"/>     <use href="#ins" transform="rotate(180 512 512)"/>     <use href="#ins" transform="rotate(240 512 512)"/>     <use href="#ins" transform="rotate(300 512 512)"/>   </g>   <circle cx="512" cy="512" r="238" fill="url(#face)"/>   <circle cx="512" cy="512" r="214" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 14" opacity=".28"/>   <path fill="url(#spade)" d="M512 352     C 470 410 384 452 384 530     C 384 584 426 618 470 618     C 488 618 500 612 506 604     C 502 640 488 664 452 680     L 572 680     C 536 664 522 640 518 604     C 524 612 536 618 554 618     C 598 618 640 584 640 530     C 640 452 554 410 512 352 Z"/> </svg>  
    <h1>Home Game Ledger</h1>
    <div><h2>${title}</h2><div class="muted small">${sub}</div></div>
    <div class="dots" aria-label="${UI.entry.length} of 6 digits entered">${[0,1,2,3,4,5].map(i => `<i class="${i < UI.entry.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="err" id="lockErr" aria-live="polite"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-key="${d}">${d}</button>`).join('')}
      <button data-key="clr" aria-label="Clear" style="font-size:.9rem">Clear</button><button data-key="0">0</button><button data-key="del" aria-label="Delete">⌫</button></div>
    ${setting ? '' : '<button class="btn ghost sm" data-act="forgot">Forgot passcode</button>'}
  </div></div>`;
}
async function keyPress(k){
  if (k === 'del') UI.entry = UI.entry.slice(0,-1);
  else if (k === 'clr') UI.entry = '';
  else if (UI.entry.length < 6) UI.entry += k;
  renderLock();
  if (UI.entry.length < 6) return;
  const code = UI.entry; UI.entry = '';
  if (!D.passHash){
    if (!setupFirst){ setupFirst = code; renderLock(); return; }
    if (setupFirst !== code){ setupFirst = null; renderLock(); document.getElementById('lockErr').textContent = 'Passcodes did not match. Start again.'; return; }
    D.passHash = await hash(code); setupFirst = null; save(); UI.locked = false; render(); toast('Passcode set'); return;
  }
  if (await hash(code) === D.passHash){ UI.locked = false; render(); }
  else { renderLock(); document.getElementById('lockErr').textContent = 'Wrong passcode. Try again.'; }
}

/* ---------- icons ---------- */
const ICON = {
  nights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>',
  players:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.5c2.5.2 4.3 1.8 5 4.5"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
};

/* ---------- render ---------- */
function render(){
  if (UI.locked) return renderLock();
  let head = '', body = '';
  if (UI.tab === 'nights' && UI.nightId && night(UI.nightId)) [head, body] = viewNight(night(UI.nightId));
  else if (UI.tab === 'nights') [head, body] = viewNights();
  else if (UI.tab === 'players') [head, body] = viewPlayers();
  else if (UI.tab === 'expenses') [head, body] = viewExpenses();
  else if (UI.tab === 'reports') [head, body] = viewReports();
  else [head, body] = viewSettings();
  const warn = storageOK ? '' : `<div class="card owes-house small">This browser is not saving data right now. Copy a backup from Settings before closing.</div>`;
  const tab = (k, label) => `<button data-tab="${k}" aria-current="${UI.tab === k}">${ICON[k]}${label}</button>`;
  // Keep the list where it was after saving; start at the top when switching screens
  const view = [UI.tab, UI.nightId, UI.nightTab, UI.report].join('|');
  const oldMain = $app.querySelector('main');
  const keep = oldMain && UI.lastView === view && !UI.resetScroll ? oldMain.scrollTop : 0;
  UI.lastView = view; UI.resetScroll = false;
  $app.innerHTML = `<header class="top">${head}</header><main>${warn}${body}</main>
    <nav class="tabs"><div class="in">${tab('nights','Nights')}${tab('players','Players')}${tab('expenses','Expenses')}${tab('reports','Reports')}${tab('settings','Settings')}</div></nav>`;
  if (keep) $app.querySelector('main').scrollTop = keep;
}

function viewNights(){
  const list = [...D.nights].sort((a,b) => (b.date + b.start).localeCompare(a.date + a.start));
  const head = `<div class="grow"><h1>Game Nights</h1><div class="sub">${list.length ? list.length + ' recorded' : 'No nights yet'}</div></div><button class="btn sm" data-act="newNight">+ New night</button>`;
  if (!list.length) return [head, `<div class="card empty"><div class="suits">♠♥♦♣</div><div><h2>Set up your first game night</h2><p class="small">Enter the date, start time, location, game type and house rules. Then check players in and record rebuys and cash-outs as the night goes.</p></div><button class="btn" data-act="newNight">Set up a game night</button></div>`];
  const body = list.map(n => {
    const t = nightTotals(n);
    return `<button class="card tap stack" data-open-night="${n.id}">
      <div class="split"><h3>${esc(fmtDate(n.date))}</h3><span class="pill ${n.status}">${n.status === 'open' ? 'Live' : 'Closed'}</span></div>
      <div class="small"><b style="color:var(--gold-hi)">${esc(n.gameType)}</b><span class="muted"> · ${esc([fmtTime(n.start), n.location, n.seats + ' seats'].filter(Boolean).join(' · '))}</span></div>
      <div class="row small num">
        <span>${t.players} player${t.players === 1 ? '' : 's'}</span><span class="muted">·</span><span>In ${money(t.buyin)}</span><span class="muted">·</span><span>Out ${money(t.cashout)}</span>
      </div>
      ${(t.owesHouse || t.houseOwes) ? `<div class="row small num">${t.owesHouse ? `<span class="owes-house">Owed to house ${money(t.owesHouse)}</span>` : ''}${t.houseOwes ? `<span class="owes-player">House owes players ${money(t.houseOwes)}</span>` : ''}</div>` : ''}
      ${n.status === 'closed' ? `<div class="small num">House net <b class="${t.net >= 0 ? 'win' : 'loss'}">${money(t.net)}</b></div>` : ''}
    </button>`;
  }).join('');
  return [head, body];
}

function viewNight(n){
  const head = `<button class="iconbtn" data-act="backNights" aria-label="All nights">${ICON.back}</button>
    <div class="grow"><h1>${esc(fmtDate(n.date))}</h1><div class="sub">${esc([n.gameType, fmtTime(n.start), n.location].filter(Boolean).join(' · '))}</div></div>
    <span class="pill ${n.status}">${n.status === 'open' ? 'Live' : 'Closed'}</span>
    <button class="iconbtn" data-act="editNight" aria-label="Edit night details">${ICON.edit}</button>`;
  const seg = (k, l) => `<button data-night-tab="${k}" aria-pressed="${UI.nightTab === k}">${l}</button>`;
  let body = `<div class="segs">${seg('money','Money')}${seg('seats','Seats')}${seg('close','Settle')}${seg('sessions','Sessions')}</div>`;
  if (UI.nightTab === 'seats') body += nightSeats(n);
  else if (UI.nightTab === 'close') body += nightClose(n);
  else if (UI.nightTab === 'sessions') body += nightSessions(n);
  else body += nightMoney(n);
  return [head, body];
}

function methodTable(byMethod){
  const rows = Object.entries(byMethod).sort((a,b) => (b[1].in + b[1].out) - (a[1].in + a[1].out));
  if (!rows.length) return '<div class="small muted">No money has changed hands yet.</div>';
  const tin = sum(rows, r => r[1].in), tout = sum(rows, r => r[1].out);
  return `<div class="tablewrap"><table><thead><tr><th>Method</th><th>Collected</th><th>Paid out</th><th>Net</th></tr></thead><tbody>
    ${rows.map(([m,v]) => `<tr><td>${esc(m)}</td><td>${money(v.in)}</td><td>${money(v.out)}</td><td class="${v.in - v.out >= 0 ? 'win' : 'loss'}"><b>${money(v.in - v.out)}</b></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${money(tin)}</b></td><td><b>${money(tout)}</b></td><td class="${tin - tout >= 0 ? 'win' : 'loss'}"><b>${money(tin - tout)}</b></td></tr>
  </tbody></table></div>`;
}

function nightMoney(n){
  const t = nightTotals(n);
  const ids = nightPlayers(n);
  let html = `${n.status === 'open' ? bombCard(n) : ''}<div class="card stack">
    <div class="stat">
      <div><div class="label">Buy-ins</div><div class="v">${money(t.buyin)}</div></div>
      <div><div class="label">Cash-outs</div><div class="v">${money(t.cashout)}</div></div>
      <div><div class="label">Owed to house</div><div class="v owes-house">${money(t.owesHouse)}</div><div class="small muted">Settle at end</div></div>
      <div><div class="label">House owes players</div><div class="v owes-player">${money(t.houseOwes)}</div><div class="small muted">Unpaid cash-outs</div></div>
    </div>

  if (!ids.length) html += `<div class="card empty"><div>Nobody checked in yet.</div><div class="small">Tap Check in player to pick someone from your roster, give them a seat and record their buy-in.</div></div>`;
  html += ids.map(pid => playerCard(n, pid)).join('');
  return html;
}

function playerCard(n, pid){
  const l = playerLedger(n, pid);
  const r = rsvp(n, pid);
  const seat = r?.seat && r.seat <= n.seats ? r.seat : null;
  const p = player(pid);
  const paidBy = Object.entries(methodTotals(l.e.filter(x => x.kind === 'bpay'))).map(([m,v]) => `${esc(m)} ${money(v.in)}`).join(' · ');
  const outBy = Object.entries(methodTotals(l.e.filter(x => x.kind === 'cpay'))).map(([m,v]) => `${esc(m)} ${money(v.out)}`).join(' · ');
  const netted = sum(l.e.filter(x => x.kind === 'cpay' && x.method === NETTED), x => x.amount);

    status = !l.buyin ? '<span class="muted">Seated, no buy-in yet</span>'

      : '<span class="in"><span class="dot"></span>Playing · buy-in paid</span>';
  } else {
    status = l.houseOwes > 0 ? `<span class="owes-player"><span class="dot"></span>Checked out · house owes ${money(l.houseOwes)}</span>`
      : l.owesHouse > 0 ? `<span class="owes-house"><span class="dot"></span>Checked out · still owes ${money(l.owesHouse)}</span>`
      : l.houseOwes < 0 ? `<span class="owes-house"><span class="dot"></span>Checked out · house overpaid ${money(-l.houseOwes)}</span>`
      : l.owesHouse < 0 ? `<span class="owes-player"><span class="dot"></span>Checked out · player overpaid ${money(-l.owesHouse)}</span>`
      : '<span class="muted"><span class="dot"></span>Checked out · settled</span>';
  }
  const hist = l.e.slice().sort((a,b) => a.t - b.t).map(x => {
    const what = { buyin: 'Buy-in', bpay:'Player paid', cashout:'Cash-out (chips)', cpay:'House paid' }[x.kind];
    const time = new Date(x.t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

    return x.method === NETTED ? `<div class="h">${body}</span></div>`

  }).join('');
  const btns = [
    !l.checkedOut ? `<button class="btn ghost" data-act="rebuy" data-pid="${pid}">${l.buyin ? 'Rebuy' : 'Buy in'}</button>` : '',
    !l.checkedOut && l.buyin ? `<button class="btn ghost" data-act="cashout" data-pid="${pid}">Cash Out</button>` : '',
    l.checkedOut && l.houseOwes > 0 ? `<button class="btn ghost" data-act="paybalance" data-pid="${pid}">Pay balance</button>` : '',
    l.checkedOut && l.owesHouse > 0 ? `<button class="btn ghost" data-act="collect" data-pid="${pid}">Collect balance</button>` : '',
    `<button class="btn ghost" data-act="notes" data-pid="${pid}">Notes</button>`].join('');

    <div class="split">
      <button class="namebtn" data-player-night="${pid}" aria-label="Edit ${esc(pname(pid))}">${seat ? `<span class="seat">${seat}</span>` : '<span class="seat open">–</span>'}<h2>${esc(pname(pid))}</h2></button>
      ${housePill(pid)}${!seat ? (l.checkedOut ? '<span class="pill">Left table</span>' : '<span class="pill wait">Waitlist</span>') : p?.regular && pid !== D.housePid ? '<span class="pill reg">Regular</span>' : ''}
    </div>
    <div class="minis num">
      <div><div class="label">Buy-in${l.buyins > 1 ? 's ×' + l.buyins : ''}</div><div class="v">${money(l.buyin)}</div></div>
      <div><div class="label">Paid in</div><div class="v ${l.bpaid ? 'in' : ''}">${money(l.bpaid - netted - sum(l.e.filter(x => x.kind === 'bpay' && x.method === BOOKS), x => x.amount))}</div></div>
      <div><div class="label">Cash-out</div><div class="v">${l.checkedOut ? money(l.cashout) : '—'}</div></div>
    </div>
    <div class="stack" style="gap:3px">
      <div class="statusline">${status}</div>
      ${paidBy ? `<div class="paidby">In: ${paidBy}</div>` : ''}
      ${l.e.some(x => x.method === BOOKS) ? `<div class="paidby books">On books: ${[['bpay','owes the house'],['cpay','house owes them']].map(([k,w]) => { const a = sum(l.e.filter(x => x.kind === k && x.method === BOOKS), x => x.amount); return a ? `${w} ${money(a)}` : ''; }).filter(Boolean).join(' · ')}</div>` : ''}
      ${l.checkedOut && (outBy || netted) ? `<div class="paidby">Out: ${[netted ? 'netted against balance ' + money(netted) : '', outBy].filter(Boolean).join(' · ')}</div>` : ''}

  </div>`;
}

const dealerLine = (amt, method) => `<div class="payline dline"><input class="dl-amt" inputmode="decimal" placeholder="Full amount" value="${amt}" aria-label="Amount"><select class="dl-method" aria-label="Paid with">${withCur(METHODS, method).map(m => `<option ${m === method ? 'selected' : ''}>${m}</option>`).join('')}</select><button type="button" class="x" data-act="dlineDel" aria-label="Remove line">✕</button></div>`;
const dealerBlock = d => `<div class="dealer stack">
  <div class="grid2"><div class="field"><label>Dealer</label><input class="d-name" value="${esc(d.name)}" placeholder="Name"></div>
  <div class="field"><label>Tips</label><input class="d-tips" inputmode="decimal" placeholder="0" value="${d.tips ? d.tips / 100 : ''}"></div></div>
  <div class="field"><label>Paid with</label><div class="dlines stack">${(d.pays.length ? d.pays : [{ amount:0, method:'Cash' }]).map((x, i, a) => dealerLine(a.length === 1 && x.amount === d.tips ? '' : x.amount ? x.amount / 100 : '', x.method)).join('')}</div></div>
  <div class="row"><button type="button" class="btn sm ghost" data-act="dealerSplit">+ Split between methods</button><button type="button" class="btn sm ghost" data-act="dealerDel">Remove dealer</button></div>

function readDealers(){
  const out = [];
  for (const el of document.querySelectorAll('#dealerList .dealer')){
    const name = el.querySelector('.d-name').value.trim(), raw = el.querySelector('.d-tips').value.trim(), tips = raw === '' ? 0 : toCents(raw);
    if (!(tips >= 0)) return { err: 'Dealer tips must be a number.' };
    const rows = [...el.querySelectorAll('.dline')].map(r => ({ raw: r.querySelector('.dl-amt').value.trim(), method: r.querySelector('.dl-method').value }));
    if (rows.length === 1 && rows[0].raw === '') rows[0].raw = String(tips / 100);
    const pays = rows.filter(r => r.raw !== '').map(r => ({ amount: toCents(r.raw), method: r.method }));
    if (pays.some(x => !(x.amount >= 0))) return { err: 'Each tip payment must be a number.' };
    const paid = sum(pays, x => x.amount);
    if (paid > tips) return { err: `${name || 'A dealer'}'s payments add up to ${money(paid)}, more than the ${money(tips)} in tips.` };
    if (tips || name) out.push({ name: name || `Dealer ${out.length + 1}`, tips, pays: pays.filter(x => x.amount > 0) });
  }
  return { dealers: out };
}

// End-of-night settlement: what should be in hand per payment method, who is still owed, and whether the table balances.
function settlement(n){
  const t = nightTotals(n);
  const m = {};
  const row = k => m[k] ||= { in:0, out:0, tips:0, exp:0 };
  Object.entries(t.byMethod).forEach(([k,v]) => { row(k).in += v.in; row(k).out += v.out; });
  (n.dealers || []).forEach(d => d.pays.forEach(x => row(x.method).tips += x.amount));
  if (t.nightExp) row(n.expenseMethod || 'Cash').exp += t.nightExp;
  Object.values(m).forEach(r => r.have = r.in - r.out - r.tips - r.exp);
  const L = nightPlayers(n).filter(pid => pid !== t.housePid).map(pid => [pid, playerLedger(n, pid)]);
  const bk = (pid, kind) => sum(n.entries.filter(x => x.pid === pid && x.kind === kind && x.method === BOOKS), x => x.amount);
  const books = nightPlayers(n).flatMap(pid => [[pid, bk(pid, 'cpay'), 'out'], [pid, bk(pid, 'bpay'), 'in']]).filter(([,a]) => a > 0);
  const nettedIn = sum(n.entries.filter(x => x.kind === 'bpay' && x.method === NETTED), x => x.amount);
  const nettedOut = sum(n.entries.filter(x => x.kind === 'cpay' && x.method === NETTED), x => x.amount);
  const collected = sum(Object.values(t.byMethod), v => v.in), paidOut = sum(Object.values(t.byMethod), v => v.out);
  const expectedDiff = t.expectedDiff;
  return { t, m, books, owedToHouse: L.filter(([,l]) => l.owesHouse > 0), houseOwes: L.filter(([,l]) => l.houseOwes > 0),
    stillPlaying: nightPlayers(n).filter(pid => { const l = playerLedger(n, pid); return l.buyin && !l.checkedOut; }),
    nettedIn, nettedOut, collected, paidOut, expectedDiff, off: (t.buyin - t.cashout) - expectedDiff,
    cashHave: m.Cash ? m.Cash.have : 0 };
}

    ${s.books.length ? `<div class="stack" style="gap:6px"><h3 class="books">On books · settle later</h3><div class="owelist">${s.books.map(([pid,a,dir]) => `<div class="o"><span>${esc(pname(pid))} <span class="small muted">${dir === 'out' ? 'house owes them' : 'owes the house'}</span></span><b class="books num">${money(a)}</b></div>`).join('')}</div><div class="small muted">Not paid tonight, so it isn't in the cash above. Record the payoff on the player's profile.</div></div>` : ''}
    <div class="grid2" style="gap:10px">
      <div class="stack" style="gap:6px"><h3 class="owes-house">Owed to the house</h3>

      <div class="stack" style="gap:6px"><h3 class="owes-player">House owes</h3>

          <div class="line"><span class="muted">Netted vs. balance</span><span>${money(s.nettedOut)}</span></div>

    </div>
    ${s.off === 0 ? '<div class="badge ok">Table balances</div>' : `<div class="badge warn">Off by ${money(Math.abs(s.off))}. ${s.stillPlaying.length ? 'Some players have not cashed out yet.' : 'Check for a missing rebuy, cash-out, rake or tip amount.'}</div>`}
    <div class="kv num">
      <span>Rake</span><span class="v">${money(t.rake)}</span>
      <span>Tonight's expenses</span><span class="v">−${money(t.nightExp)}</span>
      <span>${t.housePid ? esc(pname(t.housePid)) + ' (house)' : 'House play'}</span><span class="v ${t.housePlay >= 0 ? 'win' : 'loss'}">${money(t.housePlay, true)}</span>
      <span class="total"><b>House net tonight</b></span><span class="v total net ${t.net >= 0 ? 'win' : 'loss'}">${money(t.net)}</span>
    </div>
    ${t.tips ? `<div class="small muted num">Dealer tips ${money(t.tips)} were paid by players, so they don't count against the house.</div>` : ''}
  </div>`;
}
// Past hosted games, newest first; each expands to its players and money summary.
function nightSessions(cur){
  const list = [...D.nights].sort((a,b) => (b.date + b.start).localeCompare(a.date + a.start));
  const all = list.map(n => [n, nightTotals(n)]);
  const closed = all.filter(([n]) => n.status === 'closed');
  const head = `<div class="card stack">
    <div class="split"><h2>All sessions</h2><span class="small muted num">${list.length} hosted</span></div>
    <div class="stat">
      <div><div class="label">Total rake</div><div class="v">${money(sum(all, ([,t]) => t.rake))}</div></div>
      <div><div class="label">House net</div><div class="v ${sum(all, ([,t]) => t.net) >= 0 ? 'win' : 'loss'}">${money(sum(all, ([,t]) => t.net))}</div></div>

  return head + all.map(([n,t]) => {
    const rows = nightPlayers(n).map(pid => [pid, playerLedger(n, pid)]).filter(([,l]) => l.e.length);
    const s = settlement(n);
    const isCur = n.id === cur.id;
    return `<details class="card session" ${isCur ? 'open' : ''}>
      <summary>
        <div class="split"><span><b>${esc(fmtDate(n.date))}</b>${isCur ? ' <span class="pill reg">Viewing</span>' : ''}</span><span class="pill ${n.status}">${n.status === 'open' ? 'Live' : 'Closed'}</span></div>

        <div class="row small num" style="margin-top:4px"><span>${t.players} player${t.players === 1 ? '' : 's'}</span><span class="muted">·</span><span>In ${money(t.buyin)}</span><span class="muted">·</span><span>Rake ${money(t.rake)}</span><span class="muted">·</span><span class="${t.net >= 0 ? 'win' : 'loss'}">Net ${money(t.net)}</span></div>
      </summary>
      <div class="stack" style="margin-top:12px">
        ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Player</th><th>Buy-in</th><th>Cash-out</th><th>Result</th><th>Unpaid</th></tr></thead><tbody>
          ${rows.map(([pid,l]) => `<tr><td>${esc(pname(pid))}</td><td>${money(l.buyin)}</td><td>${l.checkedOut ? money(l.cashout) : '—'}</td><td class="${l.result >= 0 ? 'win' : 'loss'}">${l.checkedOut ? money(l.result, true) : '—'}</td><td>${l.owesHouse > 0 ? `<span class="owes-house">owes ${money(l.owesHouse)}</span>` : l.houseOwes > 0 ? `<span class="owes-player">owed ${money(l.houseOwes)}</span>` : '—'}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="small muted">No money recorded.</div>'}
        <div class="kv num small">
          <span>Buy-ins / cash-outs</span><span class="v">${money(t.buyin)} / ${money(t.cashout)}</span>
          <span>Rake</span><span class="v">${money(t.rake)}</span>
          <span>Expenses${n.expenseNote ? ' (' + esc(n.expenseNote) + ')' : ''}</span><span class="v">−${money(t.nightExp)}</span>
          <span>${t.housePid ? esc(pname(t.housePid)) + ' (house)' : 'House play'}</span><span class="v ${t.housePlay >= 0 ? 'win' : 'loss'}">${money(t.housePlay, true)}</span>
          <span class="total"><b>House net</b></span><span class="v total ${t.net >= 0 ? 'win' : 'loss'}">${money(t.net)}</span>
          <span>Cash in hand</span><span class="v">${money(s.cashHave)}</span>
          <span class="owes-house">Owed to house</span><span class="v owes-house">${money(t.owesHouse)}</span>
          <span class="owes-player">House owes</span><span class="v owes-player">${money(t.houseOwes)}</span>
          ${t.onBooks ? `<span class="books">On books · house owes</span><span class="v books">${money(t.onBooks)}</span>` : ''}
          ${t.onBooksIn ? `<span class="books">On books · players owe</span><span class="v books">${money(t.onBooksIn)}</span>` : ''}
          <span class="muted">Dealer tips (paid by players)</span><span class="v muted">${money(t.tips)}</span>
          ${(n.dealers || []).map(d => `<span class="muted small">· ${esc(d.name)}</span><span class="v muted small">${money(d.tips)}</span>`).join('')}
        </div>
        ${n.rules ? `<div class="small muted">House rules: ${esc(n.rules)}</div>` : ''}
        ${isCur ? '' : `<button class="btn ghost block" data-open-night="${n.id}">Open this session</button>`}
      </div>
    </details>`;
  }).join('');
}
function editNightSheet(n){
  openSheet(`<h2>Night details</h2>${nightFields(n)}${actions('Save details')}

  document.getElementById('nDel').addEventListener('click', () => confirmSheet('Delete this night?', 'All buy-ins, cash-outs, payments and expenses for this night will be deleted.', 'Delete night', () => { D.nights = D.nights.filter(x => x.id !== n.id); UI.nightId = null; }));

      <div class="field"><label for="nSeats">Seats</label><select id="nSeats">${[2,3,4,5,6,7,8,9,10].map(s => `<option ${s === n.seats ? 'selected' : ''}>${s}</option>`).join('')}</select></div>

function readNightFields(){

}

      <span class="av">${esc(initials(p.name))}</span>

function viewReports(){
  const head = `<div class="grow"><h1>Reports</h1><div class="sub">${UI.report === 'players' ? 'Player results across all nights' : 'Night by night and monthly totals'}</div></div>`;

function monthReport(){
  const months = [...new Set([...D.nights.map(n => n.date.slice(0,7)), ...D.expenses.map(x => x.date.slice(0,7))])].sort().reverse();
  if (!UI.month || !months.includes(UI.month)) UI.month = months[0] || todayISO().slice(0,7);
  if (!months.length) return `<div class="card empty"><div><h2>Nothing to report yet</h2><p class="small">Reports fill in once you record a game night or a monthly expense.</p></div></div>`;
  const nights = D.nights.filter(n => n.date.startsWith(UI.month)).sort((a,b) => a.date.localeCompare(b.date));
  const T = nights.map(n => [n, nightTotals(n)]);
  const tot = k => sum(T, ([,t]) => t[k]);
  const mexp = D.expenses.filter(x => x.date.startsWith(UI.month));
  const mexpTotal = sum(mexp, x => x.amount);
  const byCat = {}; mexp.forEach(x => byCat[x.category] = (byCat[x.category] || 0) + x.amount);
  const nightNet = tot('net'), hp = tot('housePlay');
  return `
  <div class="field"><label for="monthSel">Month</label><select id="monthSel">${months.map(m => `<option value="${m}" ${m === UI.month ? 'selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select></div>
  <div class="card stack"><h2>${fmtMonth(UI.month)}</h2>
    <div class="kv num">
      <span>Game nights</span><span class="v">${nights.length}</span>
      <span>Buy-ins</span><span class="v">${money(tot('buyin'))}</span>
      <span>Cash-outs</span><span class="v">${money(tot('cashout'))}</span>
      <span class="owes-house">Unpaid: owed to house</span><span class="v owes-house">${money(tot('owesHouse'))}</span>
      <span class="owes-player">Unpaid: house owes players</span><span class="v owes-player">${money(tot('houseOwes'))}</span>
      <span>Rake</span><span class="v">${money(tot('rake'))}</span>
      <span>Night expenses</span><span class="v">−${money(tot('nightExp'))}</span>
      <span>House play</span><span class="v ${hp >= 0 ? 'win' : 'loss'}">${money(hp, true)}</span>
      <span class="total"><b>Nightly house net</b></span><span class="v total ${nightNet >= 0 ? 'win' : 'loss'}">${money(nightNet)}</span>
      <span class="muted">Dealer tips (paid by players)</span><span class="v muted">${money(tot('tips'))}</span>
      ${tot('onBooks') ? `<span class="books">On books · house owes</span><span class="v books">${money(tot('onBooks'))}</span>` : ''}
      ${tot('onBooksIn') ? `<span class="books">On books · players owe</span><span class="v books">${money(tot('onBooksIn'))}</span>` : ''}
    </div>
    <div class="small muted">Unpaid amounts stay with the night they came from. See each night below.</div>
  </div>
  <div class="card stack"><div class="split"><h2>Monthly expenses</h2><b class="num">${money(mexpTotal)}</b></div>
    ${mexp.length ? `<div class="kv num">${Object.entries(byCat).map(([c,a]) => `<span>${esc(c)}</span><span class="v">${money(a)}</span>`).join('')}</div>` : '<div class="small muted">None recorded this month.</div>'}
    <hr><div class="kv num"><span>Nightly house net</span><span class="v">${money(nightNet)}</span><span>Monthly expenses</span><span class="v">−${money(mexpTotal)}</span>
    <span class="total"><b>After monthly expenses</b></span><span class="v total ${(nightNet - mexpTotal) >= 0 ? 'win' : 'loss'}">${money(nightNet - mexpTotal)}</span></div>
  </div>
  <div class="card stack"><h2>Payment methods this month</h2>${methodTable(methodTotals(nights.flatMap(n => n.entries)))}</div>
  <div class="card stack"><h2>Night by night</h2>
    ${nights.length ? `<div class="tablewrap"><table><thead><tr><th>Night</th><th>Buy-ins</th><th>Cash-outs</th><th>Owed to house</th><th>House owes</th><th>Rake</th><th>Tips</th><th>Exp.</th><th>House play</th><th>Net</th></tr></thead><tbody>
      ${T.map(([n,t]) => `<tr data-open-night="${n.id}" style="cursor:pointer"><td>${esc(shortDate(n.date))}</td><td>${money(t.buyin)}</td><td>${money(t.cashout)}</td><td class="owes-house">${money(t.owesHouse)}</td><td class="owes-player">${money(t.houseOwes)}</td><td>${money(t.rake)}</td><td>${money(t.tips)}</td><td>${money(t.nightExp)}</td><td>${money(t.housePlay, true)}</td><td class="${t.net >= 0 ? 'win' : 'loss'}"><b>${money(t.net)}</b></td></tr>`).join('')}
    </tbody></table></div><div class="small muted">Tap a night to open it. Scroll the table sideways for more columns.</div>` : '<div class="small muted">No game nights this month.</div>'}
  </div>
  ${T.map(([n,t]) => nightReportCard(n,t)).join('')}`;
}
function nightReportCard(n, t){
  const rows = nightPlayers(n).map(pid => [pid, playerLedger(n, pid)]).filter(([,l]) => l.e.length);
  return `<div class="card stack"><div class="split"><h3>${esc(fmtDate(n.date))}</h3><span class="small muted">${esc(n.gameType)}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Player</th><th>Buy-in</th><th>Cash-out</th><th>Result</th><th>Unpaid</th></tr></thead><tbody>
    ${rows.map(([pid,l]) => `<tr><td>${esc(pname(pid))}</td><td>${money(l.buyin)}</td><td>${l.checkedOut ? money(l.cashout) : '—'}</td><td class="${l.result >= 0 ? 'win' : 'loss'}">${l.checkedOut ? money(l.result, true) : '—'}</td><td>${l.owesHouse > 0 ? `<span class="owes-house">owes ${money(l.owesHouse)}</span>` : l.houseOwes > 0 ? `<span class="owes-player">owed ${money(l.houseOwes)}</span>` : '—'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No players</td></tr>'}
    </tbody></table></div>
    ${(() => { const s = settlement(n); return `<div class="small num">Cash in hand ${money(s.cashHave)} · owed to house <span class="owes-house">${money(t.owesHouse)}</span> · house owes <span class="owes-player">${money(t.houseOwes)}</span></div>`; })()}
    <div class="small num">Rake ${money(t.rake)} − expenses ${money(t.nightExp)} ${t.housePlay < 0 ? '−' : '+'} ${t.housePid ? esc(pname(t.housePid)) : 'house play'} ${money(Math.abs(t.housePlay))} = <b class="${t.net >= 0 ? 'win' : 'loss'}">house net ${money(t.net)}</b></div>
  </div>`;
}
function playerStats(pid){
  const nights = D.nights.filter(n => n.entries.some(e => e.pid === pid)).sort((a,b) => b.date.localeCompare(a.date));
  const rows = nights.map(n => [n, playerLedger(n, pid)]);
  const done = rows.filter(([,l]) => l.checkedOut);
  return { rows, nights: rows.length, buyin: sum(rows, ([,l]) => l.buyin), cashout: sum(rows, ([,l]) => l.cashout), result: sum(done, ([,l]) => l.result),
    best: done.length ? Math.max(...done.map(([,l]) => l.result)) : 0, worst: done.length ? Math.min(...done.map(([,l]) => l.result)) : 0,
    owes: sum(rows, ([,l]) => Math.max(0, l.owesHouse)), owed: sum(rows, ([,l]) => Math.max(0, l.houseOwes)) };
}
function playerReports(){
  const list = D.players.map(p => [p, playerStats(p.id)]).filter(([,s]) => s.nights).sort((a,b) => b[1].result - a[1].result);

  const [p, s] = list.find(([p]) => p.id === UI.reportPlayer);
  return `<div class="card stack"><h2>All players</h2>
    <div class="tablewrap"><table><thead><tr><th>Player</th><th>Nights</th><th>Buy-ins</th><th>Cash-outs</th><th>Result</th></tr></thead><tbody>
    ${list.map(([p,s]) => `<tr data-report-player="${p.id}" style="cursor:pointer"><td>${p.id === UI.reportPlayer ? '▸ ' : ''}${esc(p.name)}</td><td>${s.nights}</td><td>${money(s.buyin)}</td><td>${money(s.cashout)}</td><td class="${s.result >= 0 ? 'win' : 'loss'}"><b>${money(s.result, true)}</b></td></tr>`).join('')}
    </tbody></table></div><div class="small muted">Tap a player for their night-by-night history.</div></div>
  <div class="card stack"><div class="split"><h2>${esc(p.name)}</h2>${p.regular ? '<span class="pill reg">Regular</span>' : ''}</div>
    <div class="stat">
      <div><div class="label">Overall result</div><div class="v ${s.result >= 0 ? 'win' : 'loss'}">${money(s.result, true)}</div></div>
      <div><div class="label">Nights played</div><div class="v">${s.nights}</div></div>
      <div><div class="label">Best night</div><div class="v win">${money(s.best, true)}</div></div>
      <div><div class="label">Worst night</div><div class="v loss">${money(s.worst, true)}</div></div>
    </div>
    ${s.owes || s.owed ? `<div class="small">${s.owes ? `<span class="owes-house">Unpaid to house ${money(s.owes)}</span> ` : ''}${s.owed ? `<span class="owes-player">House owes ${money(s.owed)}</span>` : ''}</div>` : ''}
    <div class="tablewrap"><table><thead><tr><th>Night</th><th>Buy-in</th><th>Cash-out</th><th>Result</th><th>Unpaid</th></tr></thead><tbody>
    ${s.rows.map(([n,l]) => `<tr data-open-night="${n.id}" style="cursor:pointer"><td>${esc(shortDate(n.date))}</td><td>${money(l.buyin)}</td><td>${l.checkedOut ? money(l.cashout) : '—'}</td><td class="${l.result >= 0 ? 'win' : 'loss'}">${l.checkedOut ? money(l.result, true) : '—'}</td><td>${l.owesHouse > 0 ? `<span class="owes-house">owes ${money(l.owesHouse)}</span>` : l.houseOwes > 0 ? `<span class="owes-player">owed ${money(l.houseOwes)}</span>` : '—'}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}
