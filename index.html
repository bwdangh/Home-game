/* ---------- contacts ---------- */
// iPhone Safari offers the Contacts picker when "Contact Picker API" is on; otherwise a shared contact card (.vcf) works.
const canPickContacts = () => !!(navigator.contacts && navigator.contacts.select);
const cleanPhone = t => String(t || '').trim();
async function pickContacts(multiple){
  const res = await navigator.contacts.select(['name','tel'], { multiple });
  return res.map(c => ({ name: (c.name && c.name[0] || '').trim(), phone: cleanPhone(c.tel && c.tel[0]) })).filter(c => c.name);
}
function parseVCF(text){
  const unfolded = text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
  return unfolded.split(/BEGIN:VCARD/i).slice(1).map(card => {
    const line = re => (card.match(re) || [])[1] || '';
    let name = line(/^FN[^:\n]*:(.*)$/im).trim();
    if (!name){ const n = line(/^N[^:\n]*:(.*)$/im).split(';'); name = [n[1], n[0]].filter(Boolean).join(' ').trim(); }
    const phone = cleanPhone(line(/^(?:item\d+\.)?TEL[^:\n]*:(.*)$/im));
    return { name: name.replace(/\\,/g, ',').replace(/\;/g, ';'), phone };
  }).filter(c => c.name);
}
// Gets contacts from the picker, or from a chosen .vcf file when the picker isn't available
async function getContacts(multiple, fileInput){
  if (canPickContacts()){ try { return await pickContacts(multiple); } catch(e){ if (!fileInput) { toast('Contacts could not open. Try again.'); return []; } } }
  return new Promise(resolve => {
    fileInput.onchange = async () => {
      const out = [];
      for (const f of fileInput.files) out.push(...parseVCF(await f.text()));
      fileInput.value = ''; resolve(multiple ? out : out.slice(0,1));
    };
    fileInput.click();
  });
}
const contactBtn = (id, label) => `<button type="button" class="btn ghost sm" id="${id}" style="justify-self:start">${label}</button><input type="file" id="${id}File" accept=".vcf,text/vcard,text/x-vcard" ${id === 'impContacts' ? 'multiple' : ''} hidden>`;
function wireContactFill(btnId, nameId, phoneId){
  const b = document.getElementById(btnId); if (!b) return;
  b.addEventListener('click', async () => {
    const [c] = await getContacts(false, document.getElementById(btnId + 'File'));
    if (!c) return;
    document.getElementById(nameId).value = c.name;
    if (c.phone) document.getElementById(phoneId).value = c.phone;
  });
}
function addContactsToRoster(list){
  let added = 0, skipped = 0;
  list.forEach(c => {
    if (D.players.some(p => p.name.toLowerCase() === c.name.toLowerCase())) { skipped++; return; }
    if (D.players.length >= MAX_PLAYERS) { skipped++; return; }
    D.players.push({ id: uid(), name: c.name, phone: c.phone, notes:'', regular:false, prefSeat:0 }); added++;
  });
  return { added, skipped };
}

/* ---------- sheets ---------- */
function openSheet(html, onSubmit){
  closeSheet();
  sheetEl = document.createElement('div'); sheetEl.className = 'scrim';
  sheetEl.innerHTML = `<form class="sheet" role="dialog" aria-modal="true" novalidate><div class="handle"></div>${html}<div class="err" id="sheetErr" aria-live="polite"></div></form>`;
  document.body.appendChild(sheetEl);
  sheetEl.addEventListener('click', e => {
    if (e.target === sheetEl || e.target.closest('[data-cancel]')) return closeSheet();
    const chip = e.target.closest('.chips[data-pick] .chip');
    if (chip){
      e.preventDefault(); if (chip.disabled) return;
      const g = chip.parentElement;
      g.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
      const hidden = document.getElementById(g.dataset.pick); hidden.value = chip.dataset.val; hidden.dispatchEvent(new Event('change', { bubbles:true }));
    }
    if (e.target.closest('[data-addline]')){ e.preventDefault(); const box = e.target.closest('[data-paylines]'); box.querySelector('.lines').insertAdjacentHTML('beforeend', payLine(box.dataset.settle === '1', '', 'Cash', box.dataset.books === '1')); }
    const x = e.target.closest('.payline .x'); if (x){ e.preventDefault(); x.closest('.payline').remove(); sheetEl.querySelector('form').dispatchEvent(new Event('input')); }
  });
  sheetEl.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = await onSubmit(sheetEl.querySelector('form'));
    if (err) document.getElementById('sheetErr').textContent = err; else { closeSheet(); save(); render(); }
  });
  const first = sheetEl.querySelector('input:not([type=hidden]):not([readonly]),select,textarea'); if (first && !first.dataset.nofocus && first.tagName !== 'SELECT') setTimeout(() => first.focus(), 60);
}
function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; } }
const actions = (label, danger) => `<div class="grid2"><button class="btn ghost" type="button" data-cancel>Cancel</button><button class="btn ${danger ? 'danger' : ''}" type="submit">${label}</button></div>`;
const methodPicker = (id, v, extra = []) => `<div class="field"><label>Payment method</label><input type="hidden" id="${id}" value="${esc(v || 'Cash')}"><div class="chips" data-pick="${id}">${withCur([...METHODS, ...extra], v).map(m => `<button type="button" class="chip" data-val="${m}" aria-pressed="${m === (v || 'Cash')}">${m}</button>`).join('')}</div></div>`;
const val = id => document.getElementById(id)?.value.trim() ?? '';

// Payment lines: one or more amount + method rows. A blank amount on a lone row means "the full amount".
const payLine = (settle, amt, method, books) => `<div class="payline"><input class="pl-amt" inputmode="decimal" placeholder="Full amount" value="${amt}" aria-label="Amount"><select class="pl-method" aria-label="Payment method">${withCur([...METHODS, ...(books ? [BOOKS] : []), ...(settle ? [SETTLE] : [])], method).map(m => `<option ${m === method ? 'selected' : ''}>${m}</option>`).join('')}</select><button type="button" class="x" aria-label="Remove line">✕</button></div>`;
const payLines = (label, settle, method, books) => `<div class="field" data-paylines data-settle="${settle ? 1 : 0}" data-books="${books ? 1 : 0}"><label>${label}</label><div class="lines stack">${payLine(settle, '', method || 'Cash', books)}</div>
  <button type="button" class="btn sm ghost" data-addline style="justify-self:start">+ Split between methods</button></div>`;
function readLines(total){
  const rows = [...sheetEl.querySelectorAll('.payline')].map(r => ({ raw: r.querySelector('.pl-amt').value.trim(), method: r.querySelector('.pl-method').value }));
  if (rows.length === 1 && rows[0].raw === '') rows[0].raw = String(total / 100);
  const lines = rows.filter(r => r.raw !== '').map(r => ({ amount: toCents(r.raw), method: r.method }));
  if (lines.some(l => !(l.amount >= 0))) return { err: 'Each payment amount must be a number.' };
  const paid = sum(lines.filter(l => l.method !== SETTLE), l => l.amount);
  return { lines: lines.filter(l => l.amount > 0 && l.method !== SETTLE), paid };
}

function confirmSheet(title, text, label, fn){
  openSheet(`<h2>${title}</h2><div class="small">${text}</div>${actions(label, true)}`, () => { fn(); });
}

function seatChips(n, pid, chosen){
  const taken = takenSeats(n, pid);
  return Array.from({ length: n.seats }, (_, i) => i + 1).map(s => `<button type="button" class="chip" data-val="${s}" aria-pressed="${s === chosen}" ${taken.includes(s) ? 'disabled' : ''}>${s}</button>`).join('')
    + `<button type="button" class="chip" data-val="0" aria-pressed="${!chosen}">Waitlist</button>`;
}
function defaultSeat(n, pid, preset){
  const taken = takenSeats(n, pid);
  const p = player(pid);
  if (preset && !taken.includes(preset)) return preset;
  if (p?.prefSeat && p.prefSeat <= n.seats && !taken.includes(p.prefSeat)) return p.prefSeat;
  for (let s = 1; s <= n.seats; s++) if (!taken.includes(s)) return s;
  return 0;
}

function checkinSheet(n, presetSeat, waitOnly){
  const inIds = nightPlayers(n);
  const avail = D.players.filter(p => !inIds.includes(p.id)).sort((a,b) => (b.regular - a.regular) || a.name.localeCompare(b.name));
  const firstPid = avail[0]?.id || '__new';
  const seat0 = waitOnly ? 0 : defaultSeat(n, firstPid === '__new' ? null : firstPid, presetSeat);
  openSheet(`<h2>Check in player</h2>
    <div class="field"><label for="ciPlayer">Player</label><select id="ciPlayer">${avail.map(p => `<option value="${p.id}">${p.regular ? '★ ' : ''}${esc(p.name)}${p.prefSeat ? ' · seat ' + p.prefSeat : ''}</option>`).join('')}<option value="__new" ${firstPid === '__new' ? 'selected' : ''}>+ Create new player profile…</option></select></div>
    <div class="stack" id="ciNew" ${firstPid === '__new' ? '' : 'hidden'}>
      ${contactBtn('ciFill', 'Fill from Contacts')}
      <div class="field"><label for="ciName">Name</label><input id="ciName" autocomplete="name"></div>
      <div class="grid2"><div class="field"><label for="ciPhone">Phone (optional)</label><input id="ciPhone" type="tel" autocomplete="tel"></div>
      <label class="row" style="cursor:pointer;align-self:end;min-height:44px"><input id="ciReg" type="checkbox" style="width:22px;min-height:22px"><span>Regular</span></label></div>
    </div>
    <div class="field"><label>Seat</label><input type="hidden" id="ciSeat" value="${seat0}"><div class="chips" data-pick="ciSeat" id="ciSeats">${seatChips(n, null, seat0)}</div></div>
    <div class="field"><label for="mAmt">Buy-in amount</label><input id="mAmt" inputmode="decimal" placeholder="Leave empty to seat without a buy-in" data-nofocus="1"></div>
    ${payLines('How they paid', true, 'Cash', true)}
    ${actions('Check in')}`, () => {
    let pid = val('ciPlayer');
    if (pid === '__new'){
      const name = val('ciName'); if (!name) return 'Enter the new player\'s name.';
      if (D.players.length >= MAX_PLAYERS) return `Your roster is full (${MAX_PLAYERS}). Remove a player first.`;
      if (D.players.some(x => x.name.toLowerCase() === name.toLowerCase())) return 'A player with that name is already on the roster.';
      const p = { id: uid(), name, phone: val('ciPhone'), notes:'', regular: document.getElementById('ciReg').checked, prefSeat:0 }; D.players.push(p); pid = p.id;
    }
    const amtRaw = val('mAmt'); let amt = 0, lines = [];
    if (amtRaw !== ''){
      amt = toCents(amtRaw); if (!(amt > 0)) return 'Enter the buy-in amount, or leave it empty.';
      const r = readLines(amt); if (r.err) return r.err; if (r.paid > amt) return `Payments add up to ${money(r.paid)}, more than the ${money(amt)} buy-in.`;
      lines = r.lines;
    }
    const seat = parseInt(val('ciSeat')) || 0;
    if (seat && takenSeats(n, pid).includes(seat)) return `Seat ${seat} is taken.`;
    n.rsvps.push({ pid, t: Date.now(), seat: seat || null, notes:'' });
    if (amt) recordBuyin(n, pid, amt, lines);
    toast(seat ? `${pname(pid)} in seat ${seat}` : `${pname(pid)} added to waitlist`);
  });
  wireContactFill('ciFill', 'ciName', 'ciPhone');
  document.getElementById('ciPlayer').addEventListener('change', e => {
    const v = e.target.value; document.getElementById('ciNew').hidden = v !== '__new';
    const s = waitOnly ? 0 : defaultSeat(n, v === '__new' ? null : v, presetSeat);
    document.getElementById('ciSeat').value = s; document.getElementById('ciSeats').innerHTML = seatChips(n, null, s);
  });
}
function recordBuyin(n, pid, amt, lines){
  const t = Date.now();
  n.entries.push({ id: uid(), pid, kind:'buyin', amount: amt, t });
  lines.forEach((l, i) => n.entries.push({ id: uid(), pid, kind:'bpay', amount: l.amount, method: l.method, t: t + 1 + i }));
}

function rebuySheet(n, pid){
  const l = playerLedger(n, pid);
  openSheet(`<div class="label">${l.buyin ? 'Rebuy' : 'Buy-in'}</div><h2>${esc(pname(pid))}</h2>
    ${l.buyin ? `<div class="small muted num">In for ${money(l.buyin)} so far${l.owesHouse > 0 ? ` · settle at end ${money(l.owesHouse)}` : ''}</div>` : ''}
    <div class="field"><label for="mAmt">Amount</label><input id="mAmt" inputmode="decimal" placeholder="500" required></div>
    ${payLines('How they paid', true, 'Cash', true)}
    ${actions(l.buyin ? 'Record rebuy' : 'Record buy-in')}`, () => {
    const amt = toCents(val('mAmt')); if (!(amt > 0)) return 'Enter the amount.';
    const r = readLines(amt); if (r.err) return r.err; if (r.paid > amt) return `Payments add up to ${money(r.paid)}, more than ${money(amt)}.`;
    recordBuyin(n, pid, amt, r.lines);
    toast(r.paid < amt ? `${pname(pid)}: ${money(amt - r.paid)} to settle at end` : 'Recorded');
  });
}

function cashoutSheet(n, pid){
  const l = playerLedger(n, pid);
  const owed = Math.max(0, l.owesHouse);
  openSheet(`<div class="label">Cash Out</div><h2>${esc(pname(pid))}</h2>
    <div class="small muted num">Bought in ${money(l.buyin)} · paid ${money(l.bpaid)}${owed ? ` · <span class="owes-house">settle at end ${money(owed)}</span>` : ''}</div>
    <div class="field"><label for="mAmt">Chips cashed out</label><input id="mAmt" inputmode="decimal" placeholder="0 if they busted" required></div>
    <div class="preview num" id="coPrev"><span class="muted">Enter the chip count to see who pays whom.</span></div>
    <button type="button" class="btn ghost block booksbtn" id="coBooks" hidden>📒 Put it On books</button>
    <div id="coLines">${payLines('Paid how', true, 'Cash', true)}</div>
    ${actions('Cash out')}`, () => {
    const raw = val('mAmt'); const chips = toCents(raw); if (raw === '' || !(chips >= 0)) return 'Enter the chips cashed out (0 if they busted).';
    const net = chips - owed;
    const r = readLines(Math.abs(net)); if (r.err) return r.err;
    if (r.paid > Math.abs(net)) return `Payments add up to ${money(r.paid)}, more than the ${money(Math.abs(net))} due.`;
    if (net < 0 && r.paid < -net) return `${pname(pid)} still owes ${money(-net - r.paid)}. Their account has to be zero before they cash out.`;
    const t = Date.now(), offset = Math.min(owed, chips);
    n.entries.push({ id: uid(), pid, kind:'cashout', amount: chips, t });
    if (offset > 0){
      n.entries.push({ id: uid(), pid, kind:'bpay', amount: offset, method: NETTED, t: t+1 });
      n.entries.push({ id: uid(), pid, kind:'cpay', amount: offset, method: NETTED, t: t+2 });
    }
    r.lines.forEach((x, i) => n.entries.push({ id: uid(), pid, kind: net >= 0 ? 'cpay' : 'bpay', amount: x.amount, method: x.method, t: t + 3 + i }));
    // Cashing out frees the seat so the next player can sit right away.
    const rv = rsvp(n, pid), freed = rv?.seat && rv.seat <= n.seats ? rv.seat : 0; if (rv) rv.seat = null;
    const bk = sum(r.lines.filter(x => x.method === BOOKS), x => x.amount);
    if (bk) return void toast(`${money(bk)} on books for ${pname(pid)}${freed ? ` · seat ${freed} open` : ''}`);
    toast(net > 0 && r.paid < net ? `House owes ${pname(pid)} ${money(net - r.paid)}` : `${pname(pid)} cashed out${freed ? ` · seat ${freed} open` : ''}`);
  });
  const amt = document.getElementById('mAmt');
  const update = () => {
    const chips = toCents(amt.value), box = document.getElementById('coPrev');
    if (!(chips >= 0) || amt.value.trim() === ''){ box.innerHTML = '<span class="muted">Enter the chip count to see who pays whom.</span>'; return; }
    const net = chips - owed, res = chips - l.buyin;
    const lbl = sheetEl.querySelector('[data-paylines] > label');
    box.innerHTML = `<div class="split"><span>Chips</span><b>${money(chips)}</b></div>
      ${owed ? `<div class="split"><span>Settle-at-end balance</span><b class="owes-house">−${money(owed)}</b></div>` : ''}
      <div class="split"><span>${net > 0 ? 'House pays player' : net < 0 ? 'Player pays house' : 'Nothing changes hands'}</span><b class="${net > 0 ? 'owes-player' : net < 0 ? 'owes-house' : 'win'}">${money(Math.abs(net))}</b></div>
      <div class="split small muted"><span>Night result</span><span class="${res >= 0 ? 'win' : 'loss'}">${money(res, true)}</span></div>`;
    lbl.textContent = net > 0 ? 'How the house is paying' : net < 0 ? 'How the player is paying the balance' : 'Paid how';
    document.getElementById('coLines').hidden = net === 0;
    const cb = document.getElementById('coBooks'); cb.hidden = net === 0;
    cb.textContent = net > 0 ? '📒 Put the payout On books' : '📒 Put what they owe On books';
  };
  amt.addEventListener('input', update);
  document.getElementById('coBooks').addEventListener('click', () => {
    sheetEl.querySelector('#coLines .lines').innerHTML = payLine(true, '', BOOKS, true);
    sheetEl.querySelector('#coLines [data-paylines] > label').textContent = 'Paid how · On books means it gets settled another day';
  });
}

function balanceSheet(n, pid, kind){
  const l = playerLedger(n, pid);
  const due = kind === 'cpay' ? l.houseOwes : l.owesHouse;
  openSheet(`<div class="label">${kind === 'cpay' ? 'Pay balance to player' : 'Collect balance from player'}</div><h2>${esc(pname(pid))}</h2>
    <div class="small num">${kind === 'cpay' ? `House owes <b class="owes-player">${money(due)}</b>` : `Player owes <b class="owes-house">${money(due)}</b>`}</div>
    ${payLines('Paid how', false, 'Cash', true)}${actions('Record payment')}`, () => {
    const r = readLines(due); if (r.err) return r.err; if (!r.paid) return 'Enter an amount.';
    if (r.paid > due) return `That is more than the ${money(due)} balance.`;
    r.lines.forEach((x, i) => n.entries.push({ id: uid(), pid, kind, amount: x.amount, method: x.method, t: Date.now() + i }));
    toast('Payment recorded');
  });
}

// Payments made at buy-in time share the buy-in's timestamp base (see recordBuyin).
const linkedPays = (n, b) => n.entries.filter(x => x.pid === b.pid && x.kind === 'bpay' && x.method !== NETTED && x.t > b.t && x.t < b.t + 100);
const centsStr = c => String(c / 100);
// Redo the "netted from chips" pair after an edit, so a settle-at-end balance is still offset correctly against the cash-out.
function renet(n, pid){
  n.entries = n.entries.filter(x => !(x.pid === pid && x.method === NETTED));
  const co = n.entries.filter(x => x.pid === pid && x.kind === 'cashout');
  if (!co.length) return;
  const l = playerLedger(n, pid), offset = Math.min(Math.max(0, l.owesHouse), l.cashout);
  if (offset > 0){
    const t = co[0].t;
    n.entries.push({ id: uid(), pid, kind:'bpay', amount: offset, method: NETTED, t: t+1 });
    n.entries.push({ id: uid(), pid, kind:'cpay', amount: offset, method: NETTED, t: t+2 });
  }
}
function editBuyinSheet(n, b){
  const pays = linkedPays(n, b);
  const lines = pays.length ? pays.map(x => payLine(true, centsStr(x.amount), x.method, true)).join('') : payLine(true, '', SETTLE, true);
  openSheet(`<div class="label">Edit buy-in</div><h2>${esc(pname(b.pid))}</h2>
    <div class="field"><label for="mAmt">Buy-in amount</label><input id="mAmt" inputmode="decimal" value="${centsStr(b.amount)}" data-nofocus="1"></div>
    <div class="field" data-paylines data-settle="1"><label>How they paid</label><div class="lines stack">${lines}</div>
    <button type="button" class="btn sm ghost" data-addline style="justify-self:start">+ Split between methods</button></div>
    <div class="small muted">Pick "${SETTLE}" for any part they haven't paid yet.</div>
    ${actions('Save changes')}
    <button type="button" class="btn danger sm" id="eDel">Delete this buy-in</button>`, () => {
    const amt = toCents(val('mAmt')); if (!(amt > 0)) return 'Enter the buy-in amount.';
    const r = readLines(amt); if (r.err) return r.err; if (r.paid > amt) return `Payments add up to ${money(r.paid)}, more than the ${money(amt)} buy-in.`;
    const ids = pays.map(x => x.id);
    n.entries = n.entries.filter(x => !ids.includes(x.id));
    b.amount = amt;
    r.lines.forEach((l, i) => n.entries.push({ id: uid(), pid: b.pid, kind:'bpay', amount: l.amount, method: l.method, t: b.t + 1 + i }));
    renet(n, b.pid);
    toast(r.paid < amt ? `Saved · ${money(amt - r.paid)} to settle at end` : 'Buy-in updated');
  });
  document.getElementById('eDel').addEventListener('click', () => {
    const ids = [b.id, ...pays.map(x => x.id)];
    confirmSheet('Delete this buy-in?', `${esc(pname(b.pid))}: ${money(b.amount)} and the payments recorded with it.`, 'Delete', () => { n.entries = n.entries.filter(x => !ids.includes(x.id)); renet(n, b.pid); });
  });
}
function editEntrySheet(n, x){
  const what = { bpay:'Payment from player', cashout:'Cash-out (chips)', cpay:'Payment to player' }[x.kind];
  openSheet(`<div class="label">Edit ${what.toLowerCase()}</div><h2>${esc(pname(x.pid))}</h2>
    <div class="field"><label for="mAmt">${x.kind === 'cashout' ? 'Chips cashed out' : 'Amount'}</label><input id="mAmt" inputmode="decimal" value="${centsStr(x.amount)}" data-nofocus="1"></div>
    ${x.method ? methodPicker('eMethod', x.method, [BOOKS]) : ''}
    ${actions('Save changes')}
    <button type="button" class="btn danger sm" id="eDel">Delete this line</button>`, () => {
    const amt = toCents(val('mAmt'));
    if (!(amt > 0) && !(x.kind === 'cashout' && amt === 0)) return 'Enter the amount.';
    x.amount = amt; if (x.method) x.method = val('eMethod');
    renet(n, x.pid); toast('Updated');
  });
  document.getElementById('eDel').addEventListener('click', () => {
    confirmSheet('Delete this line?', `${esc(pname(x.pid))}: ${what} ${money(x.amount)}${x.method ? ' · ' + esc(x.method) : ''}`, 'Delete', () => { n.entries = n.entries.filter(y => y.id !== x.id); renet(n, x.pid); });
  });
}

function booksPaySheet(p, dir){
  const due = dir === 'in' ? booksOwing(p.id) : booksOwed(p.id);
  openSheet(`<div class="label">On books payoff</div><h2>${esc(p.name)}</h2>
    <div class="small num">${dir === 'in' ? `${esc(p.name)} owes the house` : 'House owes'} <b class="books">${money(due)}</b> on books</div>
    <div class="field"><label for="bpAmt">Amount paid</label><input id="bpAmt" inputmode="decimal" value="${due / 100}"></div>
    ${methodPicker('bpMethod', 'Cash')}${actions('Record payoff')}`, () => {
    const amt = toCents(val('bpAmt')); if (!(amt > 0)) return 'Enter the amount.'; if (amt > due) return `That is more than the ${money(due)} on books.`;
    (D.bookPays ||= []).push({ id: uid(), pid: p.id, amount: amt, dir: dir || 'out', method: val('bpMethod'), date: new Date().toISOString().slice(0, 10) });
    toast(amt < due ? `${money(due - amt)} still on books` : 'On books paid off');
  });
}

function notesSheet(n, pid){
  let r = rsvp(n, pid);
  openSheet(`<div class="label">Notes for tonight</div><h2>${esc(pname(pid))}</h2>
    <div class="field"><label for="nNotes">Notes</label><textarea id="nNotes" placeholder="Left early, will pay balance Friday">${esc(r?.notes)}</textarea></div>${actions('Save notes')}`, () => {
    if (!r){ r = { pid, t: Date.now(), seat: null, notes:'' }; n.rsvps.push(r); }
    r.notes = val('nNotes'); toast('Notes saved');
  });
}

function playerNightSheet(n, pid){
  let r = rsvp(n, pid);
  const p = player(pid);
  const cur = r?.seat && r.seat <= n.seats ? r.seat : 0;
  const hasMoney = n.entries.some(e => e.pid === pid);
  openSheet(`<div class="label">Tonight</div><h2>${esc(pname(pid))}</h2>

/* ---------- bomb pot alarm ---------- */
// Alarms every 30 min from `first` until `until` (+ extraMin after "keep going"). Times past midnight belong to the next day.
const bombOf = n => {
  const b = n.bomb || (n.bomb = {});
  for (const [k, v] of Object.entries({ on:false, first:'18:30', until:'00:00', extraMin:0 })) if (b[k] === undefined) b[k] = v;
  b.fired = b.fired || {};
  return b;
};
function bombTimes(n){
  const b = bombOf(n), at = hm => new Date(`${n.date}T${hm}:00`);
  const start = at(b.first); let end = at(b.until);
  if (end <= start) end = new Date(end.getTime() + 864e5);
  end = new Date(end.getTime() + b.extraMin * 6e4);
  const out = []; for (let t = start.getTime(); t <= end.getTime(); t += 18e5) out.push(t);
  return out;
}
const clock = t => new Date(t).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
const inMin = t => { const m = Math.max(0, Math.ceil((t - Date.now()) / 6e4)); return m >= 60 ? `in ${Math.floor(m/60)} h ${m%60} min` : `in ${m} min`; };
function bombCard(n){
  const b = bombOf(n), times = bombTimes(n), next = times.find(t => t > Date.now()), last = times[times.length - 1];
  return `<div class="card stack bomb ${b.on ? 'on' : ''}">
    <div class="split"><h2>💣 Bomb pot alarm</h2><button class="switch" data-act="bombToggle" role="switch" aria-checked="${b.on}" aria-label="Bomb pot alarm"><i></i></button></div>
    ${b.on ? (next ? `<div class="bombnext"><span class="label">Next bomb pot</span><b class="num">${clock(next)}</b><span class="muted num" id="bombIn" data-t="${next}">${inMin(next)}</span></div>`
      : `<div class="small">The last bomb pot (${clock(last)}) is done. <button class="btn sm" data-act="bombMore">Keep going every 30 min</button></div>`) : ''}
    <div class="small muted">Every 30 min from ${clock(times[0])} to ${clock(last)} · <button class="linkbtn" data-act="bombSetTimes">Change times</button></div>
    ${b.on ? `<button class="btn sm ghost" data-act="bombCal">📅 Add alarms to iPhone Calendar</button>
    <div class="small muted">Calendar alerts ring even when the phone is locked. The in-app chime only plays while this app is open, so the screen stays on while the alarm is on.</div>` : ''}
  </div>`;
}

let audioCtx = null, wakeLock = null, chimeTimer = null;
function unlockAudio(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch(e){}
}
function chime(){
  if (!audioCtx) return; const t0 = audioCtx.currentTime;
  [0, .18, .36, .9, 1.08, 1.26].forEach((d, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = [880, 1175, 1568][i % 3];
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.9, t0 + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .5);
    o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .55);
  });
}
async function keepAwake(on){
  try {
    if (on && !wakeLock && navigator.wakeLock && !document.hidden){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
const bombNights = () => D.nights.filter(n => n.status === 'open' && n.bomb?.on);
function stopAlarm(){ clearInterval(chimeTimer); chimeTimer = null; document.querySelector('.alarm')?.remove(); }
function showAlarm(n, t){
  stopAlarm();
  const times = bombTimes(n), isLast = t === times[times.length - 1];
  const el = document.createElement('div'); el.className = 'alarm'; el.setAttribute('role', 'alertdialog');
  el.innerHTML = `<div class="alarmbox"><div class="boom">💣</div><h1>BOMB POT</h1><div class="num">${clock(t)}</div>
    ${isLast ? `<p>That was the last scheduled bomb pot. Keep going every 30 min?</p>
      <button class="btn" data-a="more">Keep going until ${clock(t + 2 * 36e5)}</button><button class="btn ghost" data-a="stop">Stop alarms</button>`
    : `<button class="btn" data-a="ok">Got it</button>`}</div>`;
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'more') bombMore(n);
    if (a === 'stop'){ n.bomb.on = false; keepAwake(false); }
    stopAlarm(); save(); if (!UI.locked) render();
  });
  document.body.appendChild(el);
  chime(); let rings = 1; chimeTimer = setInterval(() => { if (++rings > 6) clearInterval(chimeTimer); else chime(); }, 5000);
}
function bombMore(n){
  const b = bombOf(n), times = bombTimes(n), last = times[times.length - 1];
  b.on = true; b.extraMin += Math.max(120, Math.ceil((Date.now() - last) / 18e5) * 30 + 90);
  bombTimes(n).filter(t => t <= Date.now()).forEach(t => b.fired[t] = 1);
  toast(`Alarms continue until ${clock(bombTimes(n).slice(-1)[0])}`);
}
function bombTick(){
  const now = Date.now();
  bombNights().forEach(n => {
    bombTimes(n).filter(t => t <= now && !n.bomb.fired[t]).forEach(t => {
      n.bomb.fired[t] = 1; save();
      if (now - t < 5 * 6e4) showAlarm(n, t); // skip old alarms missed while the app was closed
    });
  });
  const el = document.getElementById('bombIn');
  if (el){ const t = +el.dataset.t; if (t <= now){ if (!sheetEl) render(); } else el.textContent = inMin(t); }
  keepAwake(bombNights().length > 0);
}
setInterval(bombTick, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) bombTick(); });

function bombTimesSheet(n){
  const b = bombOf(n);
  openSheet(`<div class="label">Bomb pot alarm</div><h2>Alarm times</h2>
    <div class="grid2"><div class="field"><label for="bFirst">First bomb pot</label><input id="bFirst" type="time" value="${b.first}"></div>
    <div class="field"><label for="bUntil">Last one at</label><input id="bUntil" type="time" value="${b.until}"></div></div>
    <div class="small muted">Then every 30 minutes. At the last one the app asks if you want to keep going.</div>
    ${actions('Save times')}`, () => {
    const f = val('bFirst'), u = val('bUntil'); if (!f || !u) return 'Pick both times.';
    b.first = f; b.until = u; b.extraMin = 0; toast('Times saved');
  });
}
function bombCalendar(n){
  const pad = x => String(x).padStart(2, '0');
  const ical = t => { const d = new Date(t); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; };
  const times = bombTimes(n).filter(t => t > Date.now() - 6e4);
  if (!times.length) return toast('No bomb pots left tonight');
  const stamp = ical(Date.now());
  const ev = times.map((t, i) => ['BEGIN:VEVENT', `UID:bomb-${n.id}-${t}@home-game`, `DTSTAMP:${stamp}`, `DTSTART:${ical(t)}`, 'DURATION:PT5M',
    `SUMMARY:💣 Bomb pot${i === times.length - 1 ? ' (last one)' : ''}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Bomb pot', 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT'].join('\r\n'));
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Home Game Ledger//Bomb pots//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...ev, 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'bomb-pots.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(`Opening ${times.length} bomb pot alarms · tap Add All`);
}

        catch(err){ return 'That is not a Home Game Ledger backup. Copy the whole text and try again.'; }
      });
    case 'resetAll': return openSheet(`<h2>Erase all data?</h2><div class="small">This cannot be undone. Copy a backup first if you might need it.</div><div class="field"><label for="wipe">Type ERASE to confirm</label><input id="wipe" autocomplete="off"></div>${actions('Erase everything', true)}`, () => { if (val('wipe') !== 'ERASE') return 'Type ERASE in capitals to confirm.'; D = blank(); UI.locked = true; UI.tab = 'nights'; UI.nightId = null; });
  }
});
function readCloseForm(n){
  const g = id => { const el = document.getElementById(id); if (!el) return null; const v = el.value.trim(); return v === '' ? 0 : toCents(v); };
  const rake = g('rake'), exp = g('nexp'), hp = g('hp');
  if (rake === null) return null; // close form not on screen
  if (![rake, exp, hp].every(v => v >= 0)) return 'Rake, expenses and house play must be numbers.';
  const dr = readDealers(); if (dr.err) return dr.err;
  n.dealers = dr.dealers; n.tips = sum(dr.dealers, d => d.tips);
  if (dr.dealers.length) D.dealerNames = dr.dealers.map(d => d.name);
  n.rake = rake; n.expense = exp; n.expenseNote = val('nexpNote');
  n.housePlay = val('hpSign') === '-' ? -hp : hp;
  n.expenseMethod = val('nexpM') || 'Cash';
  const cc = val('cashCount'); n.cashCounted = cc === '' ? null : (toCents(cc) >= 0 ? toCents(cc) : n.cashCounted);
  return null;
}
document.addEventListener('submit', e => {
  const f = e.target; if (f.closest('.scrim')) return; e.preventDefault();
  const n = night(UI.nightId);
  if (f.id === 'closeForm'){ const err = readCloseForm(n); if (err) return toast(err); save(); render(); toast('Saved'); }
  else if (f.id === 'nightForm'){ Object.assign(n, readNightFields()); save(); render(); toast('Details saved'); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'monthSel'){ UI.month = e.target.value; render(); }
  if (e.target.id === 'cashCount'){ const n = night(UI.nightId); const v = e.target.value.trim(); const c = toCents(v); n.cashCounted = v === '' ? null : (c >= 0 ? c : n.cashCounted); save(); render(); }
});
document.addEventListener('keydown', e => {
  if (UI.locked && /^[0-9]$/.test(e.key)) keyPress(e.key);
  else if (UI.locked && e.key === 'Backspace') keyPress('del');
  else if (e.key === 'Escape') closeSheet();
});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (D.passHash && !UI.locked && Date.now() - hiddenAt > 5*60*1000){ closeSheet(); UI.locked = true; UI.entry = ''; render(); }
});

load();
try { navigator.storage?.persist?.(); } catch(e){}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
render();
})();
</script>
